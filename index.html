<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hi, you!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Are+You+Serious&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #192e17;
  --chocolate: #2e2217;
  --chestnut: #542c1d;
  --cream: #ffe6d6;
  --white: #ffffff;
  --cherry: #5e0000;
  --honey: #ffda82;
  --gold: #ffcc54;
  --sage: #93bd8f;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "Are You Serious", cursive;
  color: var(--white);
  background: var(--forest);
}

#background-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
}
  main {
  position: relative;
  z-index: 1;
}
h1 {
  font-size: clamp(14px, 4.5vw, 48px);
  font-weight: 500;
  letter-spacing: 0;
  white-space: nowrap;
  margin: 0 0 40px;
  color: #ffffff;
  text-shadow:
    2px 2px 2px #192e17,
    3px 3px 5px #2e2217,
    0 0 10px #542c1d;
}
form {
  width: min(100%, 390px);
  margin: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.name-line {
  display: block;
  width: 100%;
}

#nameForm button {
  display: block;
  margin: 28px auto 0;
}

.name-line {
  width: 100%;
  border: 0;
  border-bottom: 1.5px solid var(--chestnut);
  border-radius: 0;
  outline: none;
  background: transparent;
  padding: 12px 4px;
  color: var(--white);
 text-shadow:
  1px 1px 2px #2e2217,
  2px 2px 5px #542c1d,
  0 0 8px rgba(84, 44, 29, 0.65);
  font: inherit;
  font-size: 51px;
  text-align: center;
  animation: wiggle 0.15s linear infinite;
}

.name-line::placeholder {
  color: var(--cream);
  opacity: 0.85;
  text-shadow:
  2px 2px 2px #192e17,
  3px 3px 5px #2e2217,
  0 0 10px #542c1d;
}

.name-line:focus {
  animation-play-state: paused;
  border-bottom-width: 2px;
}

@keyframes wiggle {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(0.3px, -0.3px); }
  50% { transform: translate(-0.3px, 0.2px); }
  75% { transform: translate(0.2px, 0.3px); }
}
button {
  margin-top: 28px;
  border: 0;
  background: transparent;
  color: #192e17;
  text-shadow: 0 0 2px #ffe6d6;
  font-family: "Are You Serious", cursive;
  font-size: 48px;
  letter-spacing: .08em;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform .2s, letter-spacing .2s;
}

button:hover {
  transform: translateY(-2px);
  letter-spacing: .12em;
}

button:focus-visible {
  outline: 1px solid #ffda82;
}
#error {
  color: var(--cream);
text-shadow: 1px 1px 2px var(--chocolate);
  min-height: 20px;
  margin: 12px 0 0;
  font-size: 13px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
  
/* ===== MUSIC SCENE ===== */

#scene-music {
  position: fixed;
  inset: 0;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 35px 5vw 45px;
  box-sizing: border-box;
  background: rgba(207, 249, 255, 0.25);
  color: #00288c;
  z-index: 5;
}

#scene-music[hidden] {
  display: none !important;
}

.music-heading {
  text-align: center;
  font-size: clamp(24px, 4vw, 38px);
  margin: 0;
  font-weight: normal;
}

.music-subtitle {
  text-align: center;
  font-size: 14px;
  margin-top: 8px;
}

.music-player-area {
  position: relative;
  width: min(330px, 65vw);
  height: 230px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.music-player-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

.music-drop-zone {
  position: absolute;
  width: min(225px, 68vw);
  height: min(225px, 68vw);
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.music-drop-zone.drag-over {
  outline: 3px dashed #55d0e0;
  outline-offset: 5px;
}

.player-vinyl {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

.player-vinyl.visible {
  display: block;
  animation: vinyl-spin 3s linear infinite;
}

.player-vinyl.paused {
  animation-play-state: paused;
}

.player-vinyl.visible {
  display: block;
  animation: vinyl-spin 3s linear infinite;
}

.player-vinyl.paused {
  animation-play-state: paused;
}

@keyframes vinyl-spin {
  to { transform: rotate(360deg); }
}

.music-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 12px;
}

.music-controls button,
.music-next {
  border: 1px solid #00288c;
  border-radius: 30px;
  background: #cff9ff;
  color: #00288c;
  padding: 10px 22px;
  font: inherit;
  cursor: pointer;
}

.music-controls button:hover,
.music-next:hover {
  background: #a8f3ff;
}

.music-track-name {
  text-align: center;
  min-height: 22px;
  margin-top: 8px;
  font-size: 14px;
}

.album-row {
  width: 100%;
  display: flex;
  justify-content: flex-start;
  align-items: center;

  /* Khoảng cách = đúng chiều rộng một bìa */
  gap: 115px;

  padding: 25px 65px;
  overflow-x: auto;
  overflow-y: hidden;
}

.album-card {
  position: relative;
  width: 115px;
  height: 115px;
  flex: 0 0 115px;
}

.album-cover {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 2;
  box-shadow: 0 5px 12px #00288c33;
  pointer-events: none;
}

.album-vinyl {
  position: absolute;
  width: 96%;
  height: 96%;
  top: 2%;
  left: 35%;
  object-fit: contain;
  z-index: 1;
  cursor: grab;
  touch-action: none;
}

.album-vinyl:active {
  cursor: grabbing;
}

.album-card.selected .album-cover {
  outline: 3px solid #55d0e0;
  outline-offset: 3px;
}

.drag-ghost {
  position: fixed;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1000;
  background:
    radial-gradient(circle, #a8f3ff 0 7%, #00288c 8% 12%,
    #111 13% 16%, #252525 17% 55%, #080808 56% 100%);
  opacity: .9;
  transform: translate(-50%, -50%);
}

.music-next {
  margin-top: 10px;
}

@media (max-width: 600px) {
  #scene-music {
    padding: 25px 12px 30px;
  }

  .music-player-area {
    height: 190px;
  }

    .album-row {
    justify-content: flex-start;
    gap: 100px;
    padding: 20px 30px;
  }

  .album-card {
    width: 100px;
    height: 100px;
    flex: 0 0 100px;
  }

  .album-vinyl {
    left: 35%;
  }
}

/* ===== DIALOGUE SCENE ===== */

#scene-dialogue {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  padding: 24px;
  background: transparent;
  color: white;
}

#scene-dialogue[hidden] {
  display: none !important;
}

.dialogue-content {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateX(-2vw);
}

.dialogue-line {
  display: flex;
  align-items: baseline;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 9px;
  max-width: 100%;
  white-space: nowrap;
  font-family: "Are You Serious", cursive;
  font-size: clamp(25px, 5vw, 52px);
  font-weight: normal;
  margin: 0;
  text-shadow: 2px 2px 3px #2e2217,
               3px 3px 6px #2e2217;
}

.dialogue-speaker {
  color: #ffcc54;
  flex-shrink: 0;
}

.dialogue-message {
  color: #ffffff;
}

.dialogue-hint {
  position: absolute;
  bottom: 8%;
  font-family: "Are You Serious", cursive;
  font-size: 23px;
  color: white;
  text-shadow: 2px 2px 4px #2e2217;
  opacity: 0.8;
  animation: dialogue-blink 1.2s infinite;
  pointer-events: none;
}

@keyframes dialogue-blink {
  50% { opacity: 0.3; }
}

.dialogue-answers {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 25px;
  margin-top: 45px;
  transform: translateX(-2vw);
}

.dialogue-answers[hidden] {
  display: none !important;
}

.dialogue-answer {
  margin: 0;
  padding: 10px 28px;
  border: 2px solid #ffcc54;
  border-radius: 12px;
  background: #ffda82;
  color: #542c1d;
  font-family: "Are You Serious", cursive;
  font-size: clamp(25px, 4vw, 38px);
  letter-spacing: 0;
  text-shadow: 1px 1px 2px #2e2217;
  cursor: pointer;
  transition: color .2s, transform .2s, background .2s;
}

.dialogue-answer:hover {
  color: #5e0000;
  transform: translateY(-3px);
}

.dialogue-answer:active {
  color: #5e0000;
  transform: scale(0.96);
}

@media (max-width: 600px) {
  .dialogue-line {
    font-size: clamp(23px, 5vw, 38px);
    gap: 6px;
  }

  .dialogue-content {
    transform: translateX(-1vw);
  }

  .dialogue-answers {
    gap: 12px;
    transform: translateX(-1vw);
  }
}

/* ===== ENVELOPE SCENE ===== */

#scene-envelope, #scene-letter {
  position: fixed;
  inset: 0;
  z-index: 7;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow: hidden;
  background: transparent;
}

.envelope-instruction {
  color: white;
  font-size: clamp(24px, 4vw, 38px);
  margin: 0 0 20px;
  text-align: center;
  text-shadow: 2px 2px 4px #2e2217;
  animation: dialogue-blink 1.3s infinite;
}

.envelope-image {
  width: min(85vw, 650px);
  max-height: 70vh;
  object-fit: contain;
  cursor: pointer;
  filter: drop-shadow(0 12px 20px #192e1766);
  animation: envelope-enter .9s ease-out,
             envelope-float 2.8s ease-in-out 1s infinite;
}

.envelope-image:hover {
  transform: scale(1.03);
}

@keyframes envelope-enter {
  0% { opacity: 0; transform: translateY(35px) scale(.8); }
  70% { opacity: 1; transform: translateY(-8px) scale(1.04); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes envelope-float {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -7px; }
 }
.confetti-piece {
  position: absolute;
  top: -20px;
  width: 9px;
  height: 14px;
  pointer-events: none;
  animation: confetti-fall var(--fall-time) linear var(--delay) forwards;
}

@keyframes confetti-fall {
  0% { transform: translateY(-20px) rotate(0); opacity: 0; }
  10% { opacity: 1; }
  100% {
    transform: translate(var(--drift), 110vh) rotate(720deg);
    opacity: 0;
  }
}

/* ===== LETTER ===== */

#scene-letter {
  gap: 12px;
}

  #scene-envelope[hidden],
#scene-letter[hidden] {
  display: none !important;
}
.letter-page-wrap {
  position: relative;
  width: min(88vw, 76vh, 900px);
  aspect-ratio: 1 / 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.letter-page-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
  cursor: zoom-in;
  filter: drop-shadow(0 10px 22px #192e1740);
}

.dear-text {
  position: absolute;
  left: 12%;
  top: 25%;
  width: 76%;
  color: #542c1d;
  text-align: left;
  pointer-events: none;
}
  .dear-text[hidden] {
  display: none !important;
}

.dear-label {
  font-family: "Are You Serious", cursive;
  font-size: clamp(28px, 5vw, 58px);
  margin-bottom: 4px;
}

.dear-name {
  display: block;
  max-width: 100%;
  font-family: "Are You Serious", cursive;
  font-size: clamp(25px, 7vw, 70px);
  line-height: 1.05;
  text-align: left;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.letter-progress {
  margin: 0;
  font-size: 22px;
  color: white;
  text-shadow: 1px 1px 4px #2e2217;
}

.letter-actions {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.letter-button {
  margin: 0;
  padding: 8px 22px;
  border: 1px solid #ffda82;
  border-radius: 30px;
  background: #ffda82;
  color: #542c1d;
  text-shadow: none;
  font-size: clamp(25px, 3.5vw, 36px);
  letter-spacing: 0;
}

.letter-button:hover {
  background: #ffcc54;
  color: #5e0000;
}

/* ===== IMAGE VIEWER ===== */

#imageViewer {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: rgba(15, 25, 13, .94);
}

#imageViewer[hidden] {
  display: none !important;
}

#imageViewer img {
  max-width: 95vw;
  max-height: 88vh;
  object-fit: contain;
}

#closeViewer {
  position: absolute;
  top: 10px;
  right: 20px;
  margin: 0;
  color: white;
  font-size: 42px;
  text-shadow: none;
}

@media (max-width: 600px) {
  .letter-page-wrap {
    width: min(92vw, 65vh);
  }

  .letter-button {
    font-size: 27px;
    padding: 7px 17px;
  }
}
</style>
</head>

<main>

<script>

/* ===== OPENING TO MUSIC ===== */

const nameForm = document.getElementById("nameForm");
const openingScreen = document.querySelector("main");
const musicScreen = document.getElementById("scene-music");

nameForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const input = document.getElementById("guestName");
  const name = input.value.trim().replace(/\s+/g, " ");
  const error = document.getElementById("error");

  if (name.split(" ").filter(Boolean).length < 2) {
    error.textContent = "nhập cả họ và tên nha :>";
    input.focus();
    return;
  }

  sessionStorage.setItem("guestFullName", name);
  error.textContent = "";

  openingScreen.hidden = true;
  musicScreen.hidden = false;
});


/* ===== DIALOGUE SYSTEM ===== */

const dialogueScreen = document.getElementById("scene-dialogue");
const dialogueText = document.getElementById("dialogueText");
const dialogueHint = document.getElementById("dialogueHint");
const dialogueAnswers = document.getElementById("dialogueAnswers");

const dialogues = [
  "chao xìn:D",
  "me vui khi thấy you ở đây đó:)",
  "me có thứ này muốn thông báo cho you"
];

let dialogueIndex = 0;
let typingTimer = null;
let isTyping = false;
let dialogueFinished = false;

function showDialogue(index) {
  clearInterval(typingTimer);

  dialogueIndex = index;
  dialogueText.textContent = "";
  dialogueHint.textContent = "";
  dialogueAnswers.hidden = true;

  isTyping = true;
  dialogueFinished = false;

  const message = dialogues[index];
  let charIndex = 0;

  typingTimer = setInterval(() => {
    dialogueText.textContent += message[charIndex];
    charIndex++;

    if (charIndex >= message.length) {
      finishDialogue();
    }
  }, 65);
}

function finishDialogue() {
  clearInterval(typingTimer);
  dialogueText.textContent = dialogues[dialogueIndex];
  isTyping = false;
  dialogueFinished = true;

  if (dialogueIndex < 2) {
    dialogueHint.textContent = "click anywhere to continue...";
  } else {
    dialogueHint.textContent = "";
    dialogueAnswers.hidden = false;
  }
}

dialogueScreen.addEventListener("click", (event) => {
  if (event.target.closest(".dialogue-answer")) return;

  if (isTyping) {
    finishDialogue();
    return;
  }

  if (!dialogueFinished) return;

  if (dialogueIndex < 2) {
    showDialogue(dialogueIndex + 1);

 const tracks = [

const audio = document.getElementById("birthdayMusic");
const dropZone = document.getElementById("musicDropZone");
const playerSlot = document.getElementById("playerSlot");

let selectedTrack = null;

function chooseTrack(index) {
  selectedTrack = index;
  playerVinyl.src = tracks[index].disc;

  audio.pause();
  audio.src = tracks[index].src;
  audio.load();

  trackName.textContent = tracks[index].name;

  document.querySelectorAll(".album-card").forEach((card, i) => {
    card.classList.toggle("selected", i === index);
  });
}


/* DRAG VINYL */

let dragging = false;
let ghost = null;
let draggedTrack = null;

document.querySelectorAll(".album-vinyl").forEach(vinyl => {

  vinyl.addEventListener("pointerdown", function(e) {
    e.preventDefault();

    dragging = true;
    draggedTrack = Number(this.dataset.track);

    ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    document.body.appendChild(ghost);

    moveGhost(e.clientX, e.clientY);
    this.setPointerCapture(e.pointerId);
  });

  vinyl.addEventListener("pointermove", function(e) {
    if (!dragging) return;

    moveGhost(e.clientX, e.clientY);

    const rect = dropZone.getBoundingClientRect();

    const inside =
      e.clientX >= rect.left &&
      e.clientX <= rect.right &&
      e.clientY >= rect.top &&
      e.clientY <= rect.bottom;

    playerSlot.classList.toggle("drag-over", inside);
  });

  vinyl.addEventListener("pointerup", function(e) {
    if (!dragging) return;

    const rect = dropZone.getBoundingClientRect();

    const inside =
      e.clientX >= rect.left &&
      e.clientX <= rect.right &&
      e.clientY >= rect.top &&
      e.clientY <= rect.bottom;

    if (inside) chooseTrack(draggedTrack);

    endDrag();
  });

  vinyl.addEventListener("pointercancel", endDrag);
});

function moveGhost(x, y) {
  if (!ghost) return;

  ghost.style.left = x + "px";
  ghost.style.top = y + "px";
}

function endDrag() {
  dragging = false;

  if (ghost) {
    ghost.remove();
    ghost = null;
  }

  playerSlot.classList.remove("drag-over");
}


/* PLAY / PAUSE */

document.getElementById("playMusic").addEventListener("click", function() {
  if (selectedTrack === null) {
    trackName.textContent = "choose a record first :>";
    return;
  }

  audio.play().then(() => {
    playerVinyl.classList.remove("paused");
  }).catch(() => {
    trackName.textContent = "couldn't play this track — check the audio file";
  });
});

document.getElementById("pauseMusic").addEventListener("click", function() {
  audio.pause();
  playerVinyl.classList.add("paused");
});

function makeConfetti() {
  confettiLayer.innerHTML = "";

  const colors = [
    "#ffda82", "#ffe6d6", "#93bd8f",
    "#ffcc54", "#ffffff"
  ];

  for (let i = 0; i < 42; i++) {
    const piece = document.createElement("span");

    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.background = colors[i % colors.length];

    piece.style.setProperty(
      "--fall-time",
      (3 + Math.random() * 3) + "s"
    );

    piece.style.setProperty(
      "--delay",
      Math.random() * 1.5 + "s"
    );

    piece.style.setProperty(
      "--drift",
      (Math.random() * 150 - 75) + "px"
    );

    confettiLayer.appendChild(piece);
  }
}

/* ===== SAVE DEAR AS JPG ===== */

saveDear.addEventListener("click", async () => {
  const image = new Image();
  image.src = "assets/Dear.png";

  try {
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = reject;

      if (image.complete && image.naturalWidth > 0) {
        resolve();
      }
    });

    await document.fonts.ready;

    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(image, 0, 0);

    const w = canvas.width;
    const h = canvas.height;

    const x = w * 0.12;
    const y = h * 0.25;
    const maxWidth = w * 0.76;

    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#542c1d";

    // Chữ Dear nhỏ
    const labelSize = w * 0.04;
    ctx.font = `${labelSize}px "Are You Serious"`;
    ctx.fillText("Dear", x, y);

    // Tên khách lớn hơn
    let fontSize = w * 0.10;
    const minFontSize = w * 0.045;
    const lineHeight = 1.05;

    let lines = [];

    function makeLines(size) {
      ctx.font = `${size}px "Are You Serious"`;

      const words = guestNameForLetter.split(" ");
      const result = [];
      let line = "";

      for (const word of words) {
        const test = line ? line + " " + word : word;

        if (ctx.measureText(test).width <= maxWidth) {
          line = test;
        } else {
          if (line) result.push(line);

          if (ctx.measureText(word).width <= maxWidth) {
            line = word;
          } else {
            let part = "";

            for (const char of word) {
              if (
                ctx.measureText(part + char).width > maxWidth &&
                part
              ) {
                result.push(part);
                part = char;
              } else {
                part += char;
              }
            }

            line = part;
          }
        }
      }

      if (line) result.push(line);
      return result;
    }

    do {
      lines = makeLines(fontSize);
      fontSize -= w * 0.005;
    } while (
      fontSize > minFontSize &&
      lines.some(line => ctx.measureText(line).width > maxWidth)
    );

    ctx.font = `${Math.max(fontSize, minFontSize)}px "Are You Serious"`;

    const nameY = y + labelSize * 1.25;
    const actualLineHeight = Math.max(fontSize, minFontSize) * lineHeight;

    lines.forEach((line, index) => {
      ctx.fillText(
        line,
        x,
        nameY + index * actualLineHeight,
        maxWidth
      );
    });

    const safeName = guestNameForLetter
      .replace(/[\\/:*?"<>|]/g, "")
      .replace(/\s+/g, "_");

    const link = document.createElement("a");
    link.download = `Dear_${safeName}.jpg`;
    link.href = canvas.toDataURL("image/jpeg", 0.95);
    link.click();

  } catch (error) {
    alert("Không tải được Dear. Kiểm tra file assets/Dear.png nhé.");
    console.error(error);
  }
});
