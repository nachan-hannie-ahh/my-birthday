<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hi, you!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Are+You+Serious&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #192e17;
  --chocolate: #2e2217;
  --chestnut: #542c1d;
  --cream: #ffe6d6;
  --white: #ffffff;
  --cherry: #5e0000;
  --honey: #ffda82;
  --gold: #ffcc54;
  --sage: #93bd8f;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "Are You Serious", cursive;
  color: var(--white);
  background: var(--forest);
  background-size: cover;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("assets/opening-bg.gif") center/cover no-repeat;
  z-index: -1;
}
main {
  width: min(88vw, 560px);
  text-align: center;
  padding: 24px 0;
}
h1 {
  font-size: clamp(36px, 10vw, 72px);
  font-weight: 500;
  letter-spacing: .03em;
  margin: 0 0 40px;
}
form {
  width: min(100%, 390px);
  margin: auto;
}

.name-line {
  width: 100%;
  border: 0;
  border-bottom: 1.5px solid var(--chestnut);
  border-radius: 0;
  outline: none;
  background: transparent;
  padding: 12px 4px;
  color: var(--white);
  text-shadow: 0 0 4px var(--chestnut), 1px 1px 2px var(--chocolate);
  font: inherit;
  font-size: 51px;
  text-align: center;
  animation: wiggle 0.15s linear infinite;
}

.name-line::placeholder {
  color: var(--cream);
  opacity: 0.85;
  text-shadow: 1px 1px 2px var(--chocolate);
}

.name-line:focus {
  animation-play-state: paused;
  border-bottom-width: 2px;
}
  width: 100%;
  border: 0;
  border-bottom: 1.5px solid #542c1d;
  border-radius: 0;
  outline: none;
  background: transparent;
  padding: 12px 4px;
  color: #ffffff;
  font: inherit;
  font-size: 17px;
  text-align: center;
  animation: wiggle 0.15s linear infinite;
}
.name-line::placeholder { color: #3a559c; opacity: .75; }
.name-line:focus { animation-play-state: paused; border-bottom-width: 2px; }
@keyframes wiggle {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(0.3px, -0.3px); }
  50% { transform: translate(-0.3px, 0.2px); }
  75% { transform: translate(0.2px, 0.3px); }
}
button {
  margin-top: 28px;
  border: 0;
  background: transparent;
  color: #192e17;
  text-shadow: 0 0 2px #ffe6d6;
  font-family: "Are You Serious", cursive;
  font-size: 48px;
  letter-spacing: .08em;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform .2s, letter-spacing .2s;
}

button:hover {
  transform: translateY(-2px);
  letter-spacing: .12em;
}

button:focus-visible {
  outline: 1px solid #ffda82;
}
}
button:hover { transform: translateY(-2px); letter-spacing: .22em; }
button:focus-visible { outline: 1px solid var(--honey); }
#error {
  color: var(--cream);
text-shadow: 1px 1px 2px var(--chocolate);
  min-height: 20px;
  margin: 12px 0 0;
  font-size: 13px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <h1>nhập tên đầy đủ vô nha</h1>
  <form id="nameForm">
    <input
      class="name-line"
      id="guestName"
      type="text"
      placeholder="full name..."
      autocomplete="name"
      aria-label="Full name"
      required
    >
    <button type="submit">NEXT →</button>
    <p id="error" role="status"></p>
  </form>
</main>
<script>
document.getElementById("nameForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const input = document.getElementById("guestName");
  const name = input.value.trim().replace(/\s+/g, " ");
  const error = document.getElementById("error");

  if (name.split(" ").filter(Boolean).length < 2) {
    error.textContent = "nhập cả họ và tên nha :>";
    input.focus();
    return;
  }

  sessionStorage.setItem("guestFullName", name);
  error.textContent = "";
  alert("welcome, " + name + " :>!");
});
</script>
</body>
</html>
