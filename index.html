<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hi, you!</title>
<style>
:root {
  --mint: #cffffc;
  --sky: #cff9ff;
  --blue: #00288c;
  --cyan: #55d0e0;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: "Trebuchet MS", sans-serif;
  color: var(--blue);
  background: linear-gradient(135deg, var(--mint), var(--sky), var(--cyan));
  background-size: cover;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("assets/opening-bg.gif") center/cover no-repeat;
  z-index: -1;
}
main {
  width: min(88vw, 560px);
  text-align: center;
  padding: 24px 0;
}
h1 {
  font-size: clamp(23px, 5vw, 38px);
  font-weight: 500;
  letter-spacing: .03em;
  margin: 0 0 40px;
}
form {
  width: min(100%, 390px);
  margin: auto;
}
.name-line {
  width: 100%;
  border: 0;
  border-bottom: 1.5px solid var(--blue);
  border-radius: 0;
  outline: none;
  background: transparent;
  padding: 12px 4px;
  color: var(--blue);
  font: inherit;
  font-size: 17px;
  text-align: center;
  animation: wiggle 2.6s ease-in-out infinite;
}
.name-line::placeholder { color: #3a559c; opacity: .75; }
.name-line:focus { animation-play-state: paused; border-bottom-width: 2px; }
@keyframes wiggle {
  0%, 100% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-1.5px) rotate(-.25deg); }
  45% { transform: translateX(1.5px) rotate(.25deg); }
  70% { transform: translateX(-1px) rotate(-.15deg); }
}
button {
  margin-top: 28px;
  border: 0;
  background: transparent;
  color: var(--blue);
  font: inherit;
  font-size: 16px;
  letter-spacing: .14em;
  padding: 10px 16px;
  cursor: pointer;
  transition: transform .2s, letter-spacing .2s;
}
button:hover { transform: translateY(-2px); letter-spacing: .22em; }
button:focus-visible { outline: 1px solid var(--blue); }
#error {
  min-height: 20px;
  margin: 12px 0 0;
  font-size: 13px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <h1>nhập tên đầy đủ vô nha</h1>
  <form id="nameForm">
    <input
      class="name-line"
      id="guestName"
      type="text"
      placeholder="full name..."
      autocomplete="name"
      aria-label="Full name"
      required
    >
    <button type="submit">NEXT →</button>
    <p id="error" role="status"></p>
  </form>
</main>
<script>
document.getElementById("nameForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const input = document.getElementById("guestName");
  const name = input.value.trim().replace(/\s+/g, " ");
  const error = document.getElementById("error");

  if (name.split(" ").filter(Boolean).length < 2) {
    error.textContent = "nhập cả họ và tên nha :>";
    input.focus();
    return;
  }

  sessionStorage.setItem("guestFullName", name);
  error.textContent = "";
  alert("welcome, " + name + " :>!");
});
</script>
</body>
</html>
